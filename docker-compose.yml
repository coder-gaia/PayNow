# Serviços de apoio para desenvolvimento e testes.
#
# A aplicação em si roda fora do compose, com `pnpm dev`, porque o ciclo de
# recompilação em container é mais lento sem nenhum ganho nesta fase. O
# empacotamento da aplicação para deploy entra na fase 09.

name: paynow

services:
  postgres:
    image: postgres:16-alpine
    container_name: paynow-postgres
    environment:
      POSTGRES_USER: paynow
      POSTGRES_PASSWORD: paynow
      POSTGRES_DB: paynow
      # O ledger depende de ordenação e comparação estáveis. Fixar a collation
      # evita que o banco local divirja do de produção em ordenação de texto.
      LANG: C
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # Publicado em 5433 de propósito. A 5432 costuma já estar ocupada por uma
      # instalação nativa do PostgreSQL, e quando isso acontece a aplicação
      # conecta silenciosamente no banco errado em vez de falhar.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-shadow.sql:/docker-entrypoint-initdb.d/10-init-shadow.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paynow -d paynow']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: paynow-redis
    # Persistência ligada: filas do BullMQ com jobs agendados não podem sumir
    # quando o container reinicia durante o desenvolvimento.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Servidor SMTP local com interface web. Nenhum email sai da máquina.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: paynow-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
