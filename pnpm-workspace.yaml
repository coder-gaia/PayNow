packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Dependencias autorizadas a rodar script de instalacao.
#
# A lista e deliberadamente restritiva: em um sistema que lida com dinheiro,
# cada script de pos-instalacao e superficie de cadeia de suprimentos. So entra
# o que algum caminho do projeto realmente precisa.
#
#   prisma, @prisma/client, @prisma/engines  baixam e posicionam o query engine
#   unrs-resolver                            resolucao de modulos do ESLint
#   @parcel/watcher, esbuild                 binario nativo usado pelo modo watch
#
# Negados por nao serem exercitados por nenhum caminho do projeto:
#   @scarf/scarf      telemetria de instalacao
#   msgpackr-extract  aceleracao nativa opcional, com fallback em JavaScript
#   workerd           runtime do Cloudflare Workers, herdado por dependencia transitiva
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
  workerd: false
