name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade estatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Formatacao
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      # As decisões arquiteturais viram erro de lint, e esta etapa prova que as
      # regras realmente disparam. Já aconteceu de as regras estarem
      # configuradas e inertes, o que é pior do que não ter regra: dá a
      # impressão de que a fronteira está protegida.
      - name: Regras arquiteturais
        run: pnpm verify:architecture

  testes:
    name: Testes unitarios
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Compilar
        run: pnpm build

      - name: Testes com cobertura
        run: pnpm test:cov

      - name: Enviar cobertura ao Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest

    # Aqui os serviços usam as portas padrão. O docker-compose local publica o
    # PostgreSQL em 5433 para não colidir com instalação nativa, situação que
    # não existe em runner efêmero.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paynow
          POSTGRES_PASSWORD: paynow
          POSTGRES_DB: paynow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paynow -d paynow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Sem SMTP aqui, o envio de recibo falhava em toda execucao e o CI passava
      # a exercitar um caminho degradado que nao existe em lugar nenhum. Foi
      # essa divergencia entre local e CI que escondeu o defeito do outbox
      # parando no primeiro consumidor que falha.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://paynow:paynow@localhost:5432/paynow?schema=public
      REDIS_URL: redis://localhost:6379
      WORKER_ENABLED: 'false'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      # Segredo descartável do runner. Não é credencial: existe apenas para que
      # a validação de ambiente aceite subir a aplicação durante os testes.
      JWT_SECRET: chave-de-assinatura-descartavel-exclusiva-do-ci-do-paynow

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # A imagem do Mailpit nao traz ferramenta de health check utilizavel pelo
      # runner, entao a espera e por porta aberta, que e o que de fato importa.
      - name: Aguardar o Mailpit
        run: timeout 60 bash -c 'until (echo > /dev/tcp/localhost/1025) 2>/dev/null; do sleep 1; done'

      - name: Aplicar migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Compilar
        run: pnpm build

      - name: Testes ponta a ponta
        working-directory: apps/api
        run: pnpm exec jest --config jest.e2e.config.js

  adversarial:
    name: Suite adversarial
    runs-on: ubuntu-latest

    # Job separado da suite ponta a ponta de proposito. O custo e outro, e o
    # significado da falha tambem: uma suite ponta a ponta vermelha aponta um
    # caso conhecido que quebrou, e esta aqui aponta um caso que ninguem tinha
    # pensado. Misturadas, o retorno rapido das outras some atras dos minutos
    # desta.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paynow
          POSTGRES_PASSWORD: paynow
          POSTGRES_DB: paynow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paynow -d paynow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://paynow:paynow@localhost:5432/paynow?schema=public
      REDIS_URL: redis://localhost:6379
      WORKER_ENABLED: 'false'
      JWT_SECRET: chave-de-assinatura-descartavel-exclusiva-do-ci-do-paynow
      # Sem Mailpit neste job: a suite adversarial nao passa pelo envio de
      # recibo, e desde a correcao do outbox um consumidor fora do ar nao
      # impede os outros. O que ela exercita e o caminho do dinheiro.

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Aplicar migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Compilar
        run: pnpm build

      # A semente sai no log da propria suite. Quando este job falhar, a
      # investigacao comeca copiando o `SEED=` de la e rodando localmente:
      # `SEED=<n> pnpm --filter @paynow/api test:adversarial`.
      - name: Cenarios adversariais
        working-directory: apps/api
        run: pnpm exec jest --config jest.adversarial.config.js

  commits:
    name: Padrao de commit
    runs-on: ubuntu-latest

    # Roda tambem em push, e nao so em pull request. O trabalho aqui vai direto
    # para a main, entao a condicao anterior fazia este job ser pulado em toda
    # execucao: uma regra que nunca roda nao e uma regra.
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Validar mensagens de commit
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_ANTES: ${{ github.event.before }}
          PUSH_DEPOIS: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENTO" = "pull_request" ]; then
            de="$PR_BASE"
            ate="$PR_HEAD"
          else
            de="$PUSH_ANTES"
            ate="$PUSH_DEPOIS"

            # Push inicial de um branch, ou force-push que reescreveu historico:
            # o ponto anterior pode ser o sha zerado ou um commit que nao existe
            # mais. Nos dois casos nao ha intervalo, e vale validar so o topo.
            if [ "$de" = "0000000000000000000000000000000000000000" ]                || ! git cat-file -e "$de^{commit}" 2>/dev/null; then
              echo "Ponto anterior indisponivel: validando apenas o commit do topo."
              pnpm commitlint --from "$ate~1" --to "$ate" --verbose
              exit $?
            fi
          fi

          pnpm commitlint --from "$de" --to "$ate" --verbose
